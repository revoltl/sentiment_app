{% extends "base.html" %}

{% block content %}
<div class="glass-card p-6 h-[calc(100vh-160px)] flex flex-col">
    <div class="flex gap-4 mb-6">
        <div class="flex-1">
            <label class="block text-sm font-bold mb-2 opacity-60">选择配置文件</label>
            <select id="config-select" class="w-full bg-white/10 rounded px-3 py-2 outline-none border border-white/10" onchange="loadConfig(this.value)">
                <option value="">-- 请选择 --</option>
            </select>
        </div>
        <div class="flex items-end">
            <button onclick="saveConfig()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-lg font-bold transition">保存修改</button>
        </div>
    </div>

    <div class="flex-1 overflow-hidden flex gap-6">
        <!-- 表单编辑区 -->
        <div id="editor-container" class="flex-1 overflow-y-auto pr-4 space-y-4">
            <div class="text-center py-20 opacity-30">请选择左侧配置文件进行编辑</div>
        </div>
        
        <!-- 实时 JSON 预览 -->
        <div class="w-1/3 bg-black/20 rounded-lg p-4 font-mono text-xs overflow-y-auto">
            <div class="text-white/40 mb-2">// 实时预览</div>
            <pre id="json-preview" class="text-indigo-300"></pre>
        </div>
    </div>
</div>

<script>
    let currentConfigName = '';
    let configData = {};

    async function initConfigs() {
        const res = await fetch('/api/configs');
        const files = await res.json();
        const select = document.getElementById('config-select');
        files.forEach(f => {
            select.innerHTML += `<option value="${f}">${f}</option>`;
        });
    }

    async function loadConfig(name) {
        if (!name) return;
        currentConfigName = name;
        const res = await fetch(`/api/config/${name}`);
        configData = await res.json();
        renderEditor(configData);
        updatePreview();
    }

    function renderEditor(data, prefix = '') {
        const container = document.getElementById('editor-container');
        if (prefix === '') container.innerHTML = '';

        Object.entries(data).forEach(([key, value]) => {
            const fieldId = prefix + key;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'glass-card p-4 border-white/5';

            if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                itemDiv.innerHTML = `<label class="block text-xs font-bold text-indigo-400 mb-2">${fieldId.toUpperCase()}</label>`;
                container.appendChild(itemDiv);
                renderEditor(value, fieldId + '.');
            } else {
                let inputHtml = '';
                if (typeof value === 'boolean') {
                    inputHtml = `<input type="checkbox" ${value ? 'checked' : ''} onchange="updateValue('${fieldId}', this.checked)" class="w-5 h-5 accent-indigo-500">`;
                } else if (typeof value === 'number') {
                    inputHtml = `<input type="number" step="any" value="${value}" oninput="updateValue('${fieldId}', parseFloat(this.value))" class="w-full bg-white/5 border border-white/10 rounded px-3 py-1 outline-none focus:border-indigo-500">`;
                } else {
                    inputHtml = `<input type="text" value="${value}" oninput="updateValue('${fieldId}', this.value)" class="w-full bg-white/5 border border-white/10 rounded px-3 py-1 outline-none focus:border-indigo-500">`;
                }
                itemDiv.innerHTML = `
                    <div class="flex justify-between items-center gap-4">
                        <label class="text-sm font-medium opacity-80">${key}</label>
                        <div class="flex-1 max-w-md">${inputHtml}</div>
                    </div>
                `;
                container.appendChild(itemDiv);
            }
        });
    }

    function updateValue(path, value) {
        const keys = path.split('.');
        let current = configData;
        for (let i = 0; i < keys.length - 1; i++) {
            current = current[keys[i]];
        }
        current[keys[keys.length - 1]] = value;
        updatePreview();
    }

    function updatePreview() {
        document.getElementById('json-preview').textContent = JSON.stringify(configData, null, 4);
    }

    async function saveConfig() {
        if (!currentConfigName) return;
        const res = await fetch(`/api/config/${currentConfigName}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(configData)
        });
        const result = await res.json();
        if (result.status === 'success') {
            alert('保存成功！');
        }
    }

    initConfigs();
</script>
{% endblock %}
